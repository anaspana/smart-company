spring.application.name=warehouse-simulator

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

simulator.warehouse.enabled=true
simulator.warehouse.id=1
simulator.warehouse.name=Warehouse Novi Sad

# Format: sectorId:minTemp:maxTemp
simulator.warehouse.sectors=99983:-20.0:-15.0,99984:2.0:8.0,99985:18.0:24.0

simulator.warehouse.heartbeat.interval=30000
simulator.warehouse.test.mode=true
simulator.warehouse.test.interval=60000