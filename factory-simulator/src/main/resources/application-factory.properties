spring.application.name=factory-simulator

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Factory identifikacija
# Ove vrednosti se menjaju za svaku instancu simulatora
simulator.factory.id=1
simulator.factory.name=Factory Novi Sad

# Proizvodi koje fabrika proizvodi
# Format: productId:minQty:maxQty (npr. 100-500 komada po javljanju)
# Nabroji sve proizvode koje ova fabrika pravi, odvojene zarezom
simulator.products=2:100:300,3:50:200,4:200:500

# Interval heartbeata (ms)
simulator.heartbeat.interval=30000

# Interval production reporta
# Za testiranje svakih 60 sekundi (u produkciji bi bilo 2x dnevno: cron = "0 0 12,0 * * *")
# Postavi simulator.production.test.mode=true za brzo testiranje
simulator.production.test.mode=true
simulator.production.test.interval=60000

simulator.factory.enabled=true