spring.application.name=vehicle-simulator

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

simulator.vehicle.enabled=true
simulator.vehicle.id=2
simulator.vehicle.plate=NS-001-AB
simulator.vehicle.min.distance=0.5
simulator.vehicle.max.distance=45.0
simulator.vehicle.start.lat=45.2671
simulator.vehicle.start.lng=19.8335

simulator.vehicle.heartbeat.interval=30000
simulator.vehicle.test.mode=true
simulator.vehicle.test.interval=60000