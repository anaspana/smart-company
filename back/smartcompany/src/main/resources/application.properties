spring.application.name=smartcompany

server.servlet.context-path=/api

spring.config.import=classpath:email.properties,classpath:aws.properties,classpath:mail-secret.properties,classpath:factory-simulator.properties,classpath:redis.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/smartcompanydb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update 
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

app.email.enabled=false

server.tomcat.threads.max=400
server.tomcat.accept-count=200

spring.datasource.hikari.maximum-pool-size=90
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000