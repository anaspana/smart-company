<div class="container">
    <h2 class="text-center pt-5 mt-3">Change Password</h2>
    <div class="row justify-content-center align-items-center">
        <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="w-50">

            <div class="form-group">
                <label for="password">New password</label>
                <input class="form-control"
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    minlength="5"
                    formControlName="password"
                    required
                    [ngClass]="{
                        'is-invalid': changePasswordForm.get('password')?.invalid && changePasswordForm.get('password')?.touched,
                        'is-valid': changePasswordForm.get('password')?.valid && changePasswordForm.get('password')?.touched
                    }">
                <div *ngIf="changePasswordForm.get('password')?.invalid && changePasswordForm.get('password')?.touched" class="text-danger small">
                    This input is not valid!
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <input class="form-control"
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm password"
                    minlength="5"
                    formControlName="confirmPassword"
                    required
                    [ngClass]="{
                        'is-invalid': (
                            changePasswordForm.get('confirmPassword')?.invalid ||
                            changePasswordForm.hasError('passwordMismatch')
                        ) && changePasswordForm.get('confirmPassword')?.touched,
                        'is-valid': changePasswordForm.get('confirmPassword')?.valid && changePasswordForm.get('confirmPassword')?.touched
                    }">
                <div *ngIf="changePasswordForm.get('confirmPassword')?.errors?.['required']
                            && changePasswordForm.get('confirmPassword')?.touched"
                    class="text-danger small">
                    This input is not valid.
                </div>
                <div *ngIf="changePasswordForm.get('confirmPassword')?.errors?.['minlength']
                            && changePasswordForm.get('confirmPassword')?.touched"
                    class="text-danger small">
                    This input is not valid.
                </div>
                <div *ngIf="changePasswordForm.hasError('passwordMissmatch')
                            && changePasswordForm.get('confirmPassword')?.touched"
                    class="text-danger small">
                    Password must match!
                </div>
            </div>
            
            <div *ngIf="errorMessage" class="alert alert-danger mt-3">
                {{ errorMessage }}
            </div>

            <button class="btn btn-primary w-100 mt-3" type="submit" [disabled]="submitting">
                <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
                {{ submitting ? 'Saving...' : 'Save changes' }}
            </button>
        </form>
    </div>
</div>
